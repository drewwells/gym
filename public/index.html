<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3ece0">
  <title>Open Floor</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="stage">
    <div class="shell">
      <div class="top-row">
        <button id="gymBtn" type="button" class="gym-btn" aria-label="Change gym">
          <span class="dot" aria-hidden="true"></span>
          <span id="gymName" class="gym-name">&hellip;</span>
          <span class="caret" aria-hidden="true">&#9662;</span>
        </button>
        <span class="product">Open Floor</span>
      </div>

      <div id="dayStrip" class="day-strip" role="tablist" aria-label="Choose a day"></div>

      <div id="swipe" class="swipe">
        <div id="track" class="track"></div>
      </div>

      <div class="source">
        <span>Source</span>
        <a id="sourceLink" class="source-link" href="#" target="_blank" rel="noopener">&mdash;</a>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
