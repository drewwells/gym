<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3ece0">
  <title>Open Floor</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- "Sporty" pairing per design_handoff_brand_directory/README.md:
       Big Shoulders Display 600-900 (display), DM Sans 400/500/700 (body),
       DM Mono 400/500 (labels/eyebrows/statuses). -->
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="stage">
    <div class="shell">
      <!-- Top row swaps content per view: board mode shows the "All floors"
           identity + product label; detail mode shows a back button + the
           gym's identity (still tap-to-switch via the bottom-sheet picker). -->
      <div class="top-row" id="topRow"></div>

      <div id="dayStrip" class="day-strip" role="tablist" aria-label="Choose a day"></div>

      <!-- Board view (the brand directory home). Hero summarizes "is anyone
           open right now?" across every brand; the directory below it is a
           collapsible accordion grouped by brand, with the user's pinned
           brand at the top. -->
      <div id="boardView" class="view view-board">
        <!-- Outer wrapper is .board-hero only — no .hero class, otherwise
             .hero's border-bottom + padding-double up with the inner. -->
        <div id="boardHero" class="board-hero"></div>
        <div id="boardList" class="brand-list" role="list"></div>
        <!-- Home bottom bar (Drew, 2026-10-20, mockup 1 + 3): the day strip
             (moved in here while the board shows) over a full-width class
             search. While searching, the strip hides and Close appears, so
             the field sits right above the keyboard with results above it.
             A non-empty query (?q=) swaps the hero + accordion for a
             class-only view (matching classes under each gym, board order). -->
        <nav id="boardBar" class="board-bar" aria-label="Day and class search">
          <div id="boardStripSlot"></div>
          <!-- Time band (Drew, 2026-10-20): two handles, 8 AM–8 PM in
               15-minute steps, at least an hour apart. The list shows floors
               with an hour free inside the band, redrawn on every handle
               move or day tap. Default today 7–8 PM; ?from=&to= in the URL. -->
          <div id="timePanel" class="time-panel">
            <div class="time-panel__head">
              <output id="timeReadout" class="time-panel__readout" for="bandFrom bandTo"></output>
              <button id="timeNow" class="time-panel__btn" type="button">Next hour</button>
            </div>
            <div class="band">
              <div class="band__track" aria-hidden="true"><div id="bandFill" class="band__fill"></div></div>
              <label for="bandFrom" class="visually-hidden">From</label>
              <input id="bandFrom" class="band__input" type="range" min="480" max="1200" step="15" value="1140">
              <label for="bandTo" class="visually-hidden">To</label>
              <input id="bandTo" class="band__input" type="range" min="480" max="1200" step="15" value="1200">
            </div>
            <div class="time-panel__ticks" aria-hidden="true"><span>8a</span><span>10a</span><span>12p</span><span>2p</span><span>4p</span><span>6p</span><span>8p</span></div>
          </div>
          <div id="classFilterBar" class="class-filter">
            <div class="class-filter__box">
              <svg class="class-filter__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <label for="classFilter" class="visually-hidden">Find a class by name</label>
              <input id="classFilter" class="class-filter__input" type="search" placeholder="Find a class" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
            </div>
            <button id="classFilterClose" class="class-filter__close" type="button" hidden>Close</button>
          </div>
        </nav>
      </div>

      <!-- Detail view: existing per-gym swipe deck. Hidden until the user
           drills in by tapping a board row. -->
      <div id="detailView" class="view view-detail" hidden>
        <div id="swipe" class="swipe">
          <div id="track" class="track"></div>
        </div>
        <!-- Layout C (Drew, 2026-10-20): the gym name stays on top as the
             title; the day strip and All / Find / Maps / Share sit in this
             bottom bar, in thumb reach. The day strip element is moved in here
             while the detail view is showing. -->
        <nav id="detailBar" class="detail-bar" aria-label="Gym page controls">
          <div id="detailStripSlot"></div>
          <div id="detailActions" class="detail-actions"></div>
        </nav>
      </div>
    </div>

    <!-- Bottom-sheet gym picker. Used by the in-detail gym switcher; also
         available as a quick jump from the board if we ever wire it in. -->
    <div id="sheetScrim" class="sheet-scrim" hidden></div>
    <div id="sheet" class="sheet" role="dialog" aria-label="Choose a gym" aria-modal="true" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <span class="sheet-title">Choose a gym</span>
        <button id="sheetClose" type="button" class="sheet-close">Close</button>
      </div>
      <div id="sheetList" class="sheet-list"></div>
    </div>
  </div>

  <script src="/free-at.js"></script>
  <script src="/app.js"></script>
</body>
</html>
