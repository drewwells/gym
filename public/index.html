<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3ece0">
  <title>Open Floor</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="stage">
    <div class="shell">
      <!-- Top row swaps content per view: board mode shows the "All floors"
           identity + product label; detail mode shows a back button + the
           gym's identity (still tap-to-switch via the bottom-sheet picker). -->
      <div class="top-row" id="topRow"></div>

      <div id="dayStrip" class="day-strip" role="tablist" aria-label="Choose a day"></div>

      <!-- Board view: hero summarizing all live gyms for the selected date,
           then one row per gym sorted by open-now → opening-later → done. -->
      <div id="boardView" class="view view-board">
        <div id="boardHero" class="hero board-hero"></div>
        <div id="boardList" class="board-list" role="list"></div>
      </div>

      <!-- Detail view: existing per-gym swipe deck. Hidden until the user
           drills in by tapping a board row. -->
      <div id="detailView" class="view view-detail" hidden>
        <div id="swipe" class="swipe">
          <div id="track" class="track"></div>
        </div>
        <div class="source">
          <span>Schedule source</span>
          <a id="sourceLink" class="source-link" href="#" target="_blank" rel="noopener">&mdash;</a>
        </div>
      </div>
    </div>

    <!-- Bottom-sheet gym picker. Used by the in-detail gym switcher; also
         available as a quick jump from the board if we ever wire it in. -->
    <div id="sheetScrim" class="sheet-scrim" hidden></div>
    <div id="sheet" class="sheet" role="dialog" aria-label="Choose a gym" aria-modal="true" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <span class="sheet-title">Choose a gym</span>
        <button id="sheetClose" type="button" class="sheet-close">Close</button>
      </div>
      <div id="sheetList" class="sheet-list"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
