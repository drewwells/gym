<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3ece0">
  <title>Open Floor</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="stage">
    <div class="shell">
      <div class="top-row">
        <button id="gymBtn" type="button" class="gym-btn" aria-label="Change gym" aria-haspopup="dialog">
          <span id="gymSwatch" class="gym-swatch" aria-hidden="true">&hellip;</span>
          <span class="gym-btn-text">
            <span id="gymBrand" class="gym-brand">&hellip;</span>
            <span class="gym-short-line">
              <span id="gymShort" class="gym-short">&hellip;</span>
              <span class="caret" aria-hidden="true">&#9662;</span>
            </span>
          </span>
        </button>
        <span class="product">Open Floor</span>
      </div>

      <div id="dayStrip" class="day-strip" role="tablist" aria-label="Choose a day"></div>

      <div id="swipe" class="swipe">
        <div id="track" class="track"></div>
      </div>

      <div class="source">
        <span>Schedule source</span>
        <a id="sourceLink" class="source-link" href="#" target="_blank" rel="noopener">&mdash;</a>
      </div>
    </div>

    <!-- Bottom-sheet gym picker. Hidden until tapping the identity button. -->
    <div id="sheetScrim" class="sheet-scrim" hidden></div>
    <div id="sheet" class="sheet" role="dialog" aria-label="Choose a gym" aria-modal="true" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <span class="sheet-title">Choose a gym</span>
        <button id="sheetClose" type="button" class="sheet-close">Close</button>
      </div>
      <div id="sheetList" class="sheet-list"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
