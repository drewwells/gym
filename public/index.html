<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crux Central Calendar</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Crux Central Calendar</h1>
            <p class="subtitle">
                Today's classes &amp; events &middot;
                <a href="https://www.cruxclimbingcenter.com/central-austin/calendar/"
                   target="_blank" rel="noopener">View on Crux &#x2197;</a>
            </p>
        </header>

        <main class="schedule-container">
            <div class="date-header">
                <span id="dateHeader">Loading&hellip;</span>
            </div>

            <div class="date-controls">
                <button id="prevDayBtn" type="button" class="btn-secondary">&larr; Prev</button>
                <button id="todayBtn" type="button" class="btn-secondary">Today</button>
                <button id="nextDayBtn" type="button" class="btn-secondary">Next &rarr;</button>
                <button id="refreshBtn" type="button" class="btn-secondary">Refresh</button>
            </div>

            <div id="loadingIndicator" class="loading" hidden>Loading&hellip;</div>
            <div id="errorIndicator" class="error-message" hidden></div>
            <div id="eventList" class="event-list"></div>
        </main>

        <footer>
            <p>
                Source:
                <a href="https://www.cruxclimbingcenter.com/central-austin/calendar/"
                   target="_blank" rel="noopener">cruxclimbingcenter.com</a>
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
